$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:lopas:protocol-foundry:observation:0.1.0
title: LoPAS Observation
description: >
  A source-grounded, immutable observation record. Observations describe what
  was seen, reported, proposed, omitted, interrupted, or repeated. They are
  evidence containers, not execution instructions.
type: object
additionalProperties: false

required:
  - schema_version
  - id
  - observed_at
  - source
  - task
  - observation
  - evidence
  - signals
  - provenance

properties:
  schema_version:
    const: 0.1.0

  id:
    type: string
    pattern: '^obs-[A-Za-z0-9][A-Za-z0-9._-]*$'

  observed_at:
    type: string
    format: date-time

  captured_at:
    type:
      - string
      - "null"
    format: date-time
    default: null

  source:
    $ref: '#/$defs/source'

  task:
    $ref: '#/$defs/task'

  observation:
    $ref: '#/$defs/observation_body'

  evidence:
    $ref: '#/$defs/evidence'

  signals:
    $ref: '#/$defs/signals'

  exclusions:
    type: array
    description: Known limits, redactions, or reasons material was omitted.
    items:
      type: string
      minLength: 1
    default: []

  provenance:
    $ref: '#/$defs/provenance'

$defs:
  source:
    type: object
    additionalProperties: false
    required:
      - type
      - source_id
      - visibility
    properties:
      type:
        type: string
        enum:
          - public_post
          - github_issue
          - meeting_note
          - support_log
          - incident_record
          - operator_note
          - suggestion_box
          - manual
          - other

      source_id:
        type: string
        minLength: 1

      uri:
        type:
          - string
          - "null"
        format: uri
        default: null

      visibility:
        type: string
        enum:
          - public
          - internal
          - confidential
          - restricted
          - unknown

      author_ref:
        type:
          - string
          - "null"
        description: Prefer a pseudonymous or hashed reference.
        default: null

      content_hash:
        type:
          - string
          - "null"
        description: Optional digest of the captured source material.
        default: null

      usage_note:
        type:
          - string
          - "null"
        description: Terms, license, consent, or retention note.
        default: null

  task:
    type: object
    additionalProperties: false
    required:
      - type
    properties:
      type:
        type: string
        minLength: 1

      context:
        type:
          - string
          - "null"
        default: null

      description:
        type:
          - string
          - "null"
        default: null

  observation_body:
    type: object
    additionalProperties: false
    required:
      - type
      - summary
    properties:
      type:
        type: string
        enum:
          - activity
          - silence
          - partial
          - failure
          - workaround
          - proposal
          - complaint
          - success
          - anomaly
          - other

      summary:
        type: string
        minLength: 1
        maxLength: 4000

      raw_excerpt:
        type:
          - string
          - "null"
        description: Optional minimal excerpt; avoid storing unnecessary raw content.
        maxLength: 2000
        default: null

      language:
        type:
          - string
          - "null"
        description: BCP 47 language tag when known.
        pattern: '^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$'
        default: null

  evidence:
    type: object
    additionalProperties: false
    required:
      - density
      - directness
      - references
    properties:
      density:
        type: string
        enum:
          - high
          - medium
          - low
          - sparse
          - unknown

      directness:
        type: string
        enum:
          - direct
          - inferred
          - mixed
          - unknown

      references:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/evidence_reference'

  evidence_reference:
    type: object
    additionalProperties: false
    required:
      - source_id
    properties:
      source_id:
        type: string
        minLength: 1

      span:
        type:
          - string
          - "null"
        description: Line, timestamp, paragraph, or other source-local span.
        default: null

      note:
        type:
          - string
          - "null"
        default: null

      uri:
        type:
          - string
          - "null"
        format: uri
        default: null

  signals:
    type: object
    additionalProperties: false
    required:
      - repeated
      - interrupted
      - avoided
      - contradiction_detected
      - urgency
    properties:
      repeated:
        type:
          - boolean
          - "null"

      interrupted:
        type:
          - boolean
          - "null"

      avoided:
        type:
          - boolean
          - "null"

      contradiction_detected:
        type:
          - boolean
          - "null"

      urgency:
        type: string
        enum:
          - none
          - low
          - medium
          - high
          - unknown

      novelty_hint:
        type:
          - string
          - "null"
        description: Descriptive hint only; not a validated novelty score.
        default: null

  provenance:
    type: object
    additionalProperties: false
    required:
      - ingestion_method
      - recorded_by
    properties:
      ingestion_method:
        type: string
        enum:
          - manual
          - adapter
          - import
          - generated_test_fixture

      recorded_by:
        type: string
        minLength: 1

      adapter_name:
        type:
          - string
          - "null"
        default: null

      adapter_version:
        type:
          - string
          - "null"
        default: null

      recorded_at:
        type:
          - string
          - "null"
        format: date-time
        default: null
