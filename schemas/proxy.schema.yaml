$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:lopas:protocol-foundry:proxy:0.1.0
title: LoPAS Proxy
description: >
  A normalized intermediate representation derived from one or more
  observations. A proxy separates reusable structure from source wording and
  records uncertainty explicitly.
type: object
additionalProperties: false

required:
  - schema_version
  - id
  - created_at
  - observation_refs
  - task
  - actors
  - friction
  - proposed_effects
  - classification
  - assessment
  - constraints
  - risk_hints
  - provenance

properties:
  schema_version:
    const: 0.1.0

  id:
    type: string
    pattern: '^proxy-[A-Za-z0-9][A-Za-z0-9._-]*$'

  created_at:
    type: string
    format: date-time

  observation_refs:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: '^obs-[A-Za-z0-9][A-Za-z0-9._-]*$'

  task:
    $ref: '#/$defs/task'

  actors:
    type: array
    items:
      $ref: '#/$defs/actor'
    default: []

  friction:
    type: array
    items:
      $ref: '#/$defs/friction'
    default: []

  proposed_effects:
    type: array
    items:
      $ref: '#/$defs/effect'
    default: []

  classification:
    $ref: '#/$defs/classification'

  assessment:
    $ref: '#/$defs/assessment'

  constraints:
    type: array
    items:
      $ref: '#/$defs/constraint'
    default: []

  risk_hints:
    type: array
    items:
      $ref: '#/$defs/risk_hint'
    default: []

  interpretation_notes:
    type: array
    description: Model or analyst interpretations that are not source facts.
    items:
      type: string
      minLength: 1
    default: []

  provenance:
    $ref: '#/$defs/provenance'

$defs:
  task:
    type: object
    additionalProperties: false
    required:
      - type
    properties:
      type:
        type: string
        minLength: 1

      context:
        type:
          - string
          - "null"
        default: null

      description:
        type:
          - string
          - "null"
        default: null

  actor:
    type: object
    additionalProperties: false
    required:
      - role
      - impact
    properties:
      role:
        type: string
        minLength: 1

      impact:
        type: string
        enum:
          - beneficiary
          - operator
          - reviewer
          - decision_maker
          - affected_party
          - external_party
          - unknown

      note:
        type:
          - string
          - "null"
        default: null

  friction:
    type: object
    additionalProperties: false
    required:
      - type
      - summary
      - severity
    properties:
      type:
        type: string
        minLength: 1

      summary:
        type: string
        minLength: 1

      severity:
        type: string
        enum:
          - low
          - medium
          - high
          - unknown

      evidence_refs:
        type: array
        items:
          type: string
          minLength: 1
        default: []

  effect:
    type: object
    additionalProperties: false
    required:
      - type
      - direction
      - summary
    properties:
      type:
        type: string
        minLength: 1

      direction:
        type: string
        enum:
          - positive
          - negative
          - mixed
          - unknown

      summary:
        type: string
        minLength: 1

      measurable:
        type:
          - boolean
          - "null"
        default: null

  classification:
    type: object
    additionalProperties: false
    required:
      - domain
      - tags
    properties:
      domain:
        type: string
        minLength: 1

      subdomain:
        type:
          - string
          - "null"
        default: null

      tags:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1

      cluster_id:
        type:
          - string
          - "null"
        default: null

  assessment:
    type: object
    additionalProperties: false
    required:
      - evidence_density
      - external_impact
      - reversibility
      - generalizability
      - novelty
      - interpretation_required
      - confidence
    properties:
      evidence_density:
        type: string
        enum:
          - high
          - medium
          - low
          - sparse
          - unknown

      external_impact:
        type: string
        enum:
          - low
          - medium
          - high
          - unknown

      reversibility:
        type: string
        enum:
          - high
          - medium
          - low
          - unknown

      generalizability:
        type: string
        enum:
          - high
          - medium
          - low
          - unknown

      novelty:
        type: string
        enum:
          - high
          - medium
          - low
          - unknown

      interpretation_required:
        type: boolean

      creative_ownership_signal:
        type:
          - boolean
          - "null"
        default: null

      confidence:
        type: number
        minimum: 0
        maximum: 1

  constraint:
    type: object
    additionalProperties: false
    required:
      - type
      - summary
    properties:
      type:
        type: string
        enum:
          - policy
          - legal
          - privacy
          - authority
          - technical
          - organizational
          - temporal
          - resource
          - other

      summary:
        type: string
        minLength: 1

      hard:
        type:
          - boolean
          - "null"
        default: null

  risk_hint:
    type: object
    additionalProperties: false
    required:
      - type
      - summary
      - severity
    properties:
      type:
        type: string
        minLength: 1

      summary:
        type: string
        minLength: 1

      severity:
        type: string
        enum:
          - low
          - medium
          - high
          - unknown

      silent_failure_possible:
        type:
          - boolean
          - "null"
        default: null

  provenance:
    type: object
    additionalProperties: false
    required:
      - generator
      - generated_from
    properties:
      generator:
        type: string
        enum:
          - human
          - rule
          - llm
          - hybrid
          - generated_test_fixture

      generated_from:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: '^obs-[A-Za-z0-9][A-Za-z0-9._-]*$'

      model:
        type:
          - string
          - "null"
        default: null

      prompt_version:
        type:
          - string
          - "null"
        default: null

      rule_version:
        type:
          - string
          - "null"
        default: null

      generated_at:
        type:
          - string
          - "null"
        format: date-time
        default: null
