name: C++ CI

on:
  push:
    paths:
      - "cpp/**"
      - ".github/workflows/cpp.yml"
  pull_request:
    paths:
      - "cpp/**"
      - ".github/workflows/cpp.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libjson-c-dev

      - name: Configure
        run: |
          cmake \
            -S cpp \
            -B cpp/build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake \
            --build cpp/build \
            --parallel

      - name: Test
        run: |
          ctest \
            --test-dir cpp/build \
            --output-on-failure
